<style>
  :root{--ground:#101318;--panel:#171B22;--line:#262C36;--text:#E7ECF2;
    --muted:#8B95A3;--dim:#5C6672;--signal:#F59F00;--local:#0CA678;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ground);color:var(--text);
    font:16px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:32px 24px;width:100%}
  .back{display:inline-block;color:var(--muted);text-decoration:none;
    font:12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:40px}
  .back:hover{color:var(--signal)}
  .mark{font:800 26px/1 -apple-system,sans-serif;letter-spacing:.05em}
  .mark b{color:var(--signal)}
  h1{font-size:30px;margin:36px 0 8px}
  .sub{color:var(--muted);margin-bottom:28px;max-width:46ch}
  form{display:flex;flex-direction:column;gap:14px}
  label{color:var(--dim);font-size:13px;margin-bottom:-8px}
  input,textarea{background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:13px 14px;
    font:16px/1.4 inherit;width:100%}
  textarea{min-height:130px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--dim)}
  button{background:var(--signal);color:#181000;border:0;border-radius:10px;
    padding:14px;font:600 16px/1 -apple-system,sans-serif;cursor:pointer;margin-top:4px}
  button:hover{filter:brightness(1.08)}
  .done{color:var(--local);font-weight:550;font-size:18px;padding:24px 0}
  .endnote{color:var(--dim);font-size:14px;margin-top:22px}
  .endnote a{color:var(--signal);text-decoration:none}
  nav.top{border-bottom:1px solid var(--line)}
  .navrow{display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;gap:16px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
  .brand{font-weight:800;font-size:18px;letter-spacing:.06em;
    color:var(--text);text-decoration:none}
  .brand .cast{color:var(--signal)}
  .links{display:flex;gap:18px;font:600 13px/1 var(--mono)}
  .links a{color:var(--muted);text-decoration:none}
  .links a:hover{color:var(--text)}
  .links a.here{color:var(--signal)}
  @media(max-width:680px){
    .navrow{flex-direction:column;align-items:flex-start;gap:10px;
      padding:14px 16px}
    .links{flex-wrap:wrap;gap:8px 14px;row-gap:8px}
    .brand{font-size:16px}

<div class="wrap">
  <a class="back" href="/">&larr; back to waycast.io</a>
  <div class="mark">WAY<b>CAST</b></div>
  <h1>Get in touch</h1>
  <p class="sub">Building this in the open. If it resonates — you run radios, care about resilience, or just want to follow along — say hello.</p>
  <form id="cform">
    <label for="cf_email">Email</label>
    <input id="cf_email" type="email" required placeholder="you@example.com">
    <label for="cf_msg">Message</label>
    <textarea id="cf_msg" required placeholder="a line about why you're interested"></textarea>
    <button type="submit">Send</button>
  </form>
  <p class="endnote">Prefer email? <a href='mailto:wmobil@gmail.com'>wmobil@gmail.com</a></p>
</div>
<script>
document.getElementById("cform").addEventListener("submit", function(e){
  e.preventDefault();
  var form = this;
  function show(text){
    var d = document.createElement("div");
    d.className = "done";
    d.textContent = text;
    form.replaceWith(d);
  }
  fetch("/contact", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("cf_email").value,
      message: document.getElementById("cf_msg").value
    })
  })
  .then(function(r){ if(!r.ok) throw 0; return r; })
  .then(function(){ show("Thanks — I'll be in touch. 📡"); })
  .catch(function(){ show("Couldn't send just now — please use the email link below."); });
});
</script>
