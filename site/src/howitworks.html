<h1>No towers. No servers. Cars talking to cars.</h1>
<div class="sub">This is the actual Waycast algorithm — slowed down so you can watch it think.</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="caption">A hazard is reported…</div>
  <div class="legend">
    <span class="l-car">cars</span>
    <span class="l-hz">hazard report</span>
    <span class="l-bcn">place beacon (shop, weather post)</span>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const cap = document.getElementById('caption');
  const ctx = cv.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientWidth * 9 / 16;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const RANGE = () => W * 0.21;        // radio range
  const RADIUS = () => W * 0.46;       // relevance radius (msg dies past it)

  // ---- world: cars on gentle orbits + fixed beacons ----
  const N = 15;
  const nodes = [];
  /* grid-jittered placement: even coverage, no clumps */
  const cells = [];
  for (let gx = 0; gx < 5; gx++)
    for (let gy = 0; gy < 3; gy++) cells.push([gx, gy]);
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  for (let i = 0; i < N; i++) {
    const fixed = i >= N - 2; // last two are place beacons
    const [gx, gy] = cells[i];
    nodes.push({
      fixed,
      cx: 0.10 + (gx + 0.25 + 0.5 * Math.random()) * 0.80 / 5,
      cy: 0.12 + (gy + 0.25 + 0.5 * Math.random()) * 0.76 / 3,
      r: fixed ? 0 : (0.03 + 0.09 * Math.random()),
      a: Math.random() * Math.PI * 2,
      va: (Math.random() < 0.5 ? -1 : 1) * (0.00025 + Math.random() * 0.0004),
      x: 0, y: 0,
      heard: 0,     // ms when message received (0 = none)
      relayAt: 0,   // scheduled relay time
      relayed: false,
      suppressed: false,
    });
  }
  function place(n) {
    n.x = n.cx * W + Math.cos(n.a) * n.r * W;
    n.y = n.cy * H + Math.sin(n.a) * n.r * W;
  }

  // ---- message lifecycle ----
  let origin = null, originPt = null, tEvent = 0;
  const rings = [];   // {x, y, t0, relay}
  const TTL = 9000;   // visible fade
  const capLines = [
    [0,    'A driver taps once. <b>A hazard is in the air</b> — no tower, no signal bars, no account.'],
    [1100, 'Every car in radio range hears it directly.'],
    [2600, 'The <b>farthest listener repeats first</b> — news races outward, not in circles.'],
    [4400, 'Cars that already heard it <b>stay quiet</b>. No echo, no flooding.'],
    [6500, 'The report stops at the edge of where it matters. Your area — not a global feed.'],
    [8200, 'And then it <b>fades away everywhere</b>. Nothing stored. Nothing tracked. Nobody watched.'],
  ];

  function newEvent(now) {
    nodes.forEach(n => { n.heard = 0; n.relayAt = 0; n.relayed = false; n.suppressed = false; });
    rings.length = 0;
    origin = nodes[Math.floor(Math.random() * (N - 2))]; // a car, not a beacon
    place(origin);
    originPt = { x: origin.x, y: origin.y };
    origin.heard = now; origin.relayed = true;
    rings.push({ x: origin.x, y: origin.y, t0: now });
    tEvent = now;
  }

  function step(now) {
    // move cars
    for (const n of nodes) { if (!n.fixed) n.a += n.va * 16; place(n); }

    if (!origin || now - tEvent > TTL + 2500) newEvent(now);

    // ring propagation: when a ring front passes a node, it receives
    for (const ring of rings) {
      const age = now - ring.t0;
      const rr = age * 0.14; // ring speed px/ms
      if (rr > RANGE()) continue;
      for (const n of nodes) {
        if (n.heard) continue;
        const d = Math.hypot(n.x - ring.x, n.y - ring.y);
        if (d <= rr && d <= RANGE()) {
          n.heard = now;
          const fromOrigin = Math.hypot(n.x - originPt.x, n.y - originPt.y);
          if (fromOrigin > RADIUS()) { n.suppressed = true; continue; }
          // contention: farther from the SENDER relays sooner
          const prox = 1 - Math.min(d / RANGE(), 1);      // 0 far .. 1 near
          n.relayAt = now + 350 + prox * 1900;            // far = fast
        }
      }
    }
    // fire scheduled relays; suppress if 2+ neighbors already relayed nearby
    for (const n of nodes) {
      if (!n.relayAt || n.relayed || now < n.relayAt) continue;
      n.relayAt = 0;
      let covered = 0;
      for (const r2 of rings)
        if (Math.hypot(n.x - r2.x, n.y - r2.y) < RANGE() * 0.8) covered++;
      if (covered >= 3) { n.suppressed = true; continue; } // heard it plenty
      n.relayed = true;
      rings.push({ x: n.x, y: n.y, t0: now });
    }

    // caption
    const age = now - tEvent;
    let line = capLines[0][1];
    for (const [t, txt] of capLines) if (age >= t) line = txt;
    if (cap.dataset.cur !== line) { cap.dataset.cur = line; cap.innerHTML = line; }
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    const age = now - tEvent;
    const fade = Math.max(0, Math.min(1, (TTL - age) / 2500)); // msg fade

    // relevance radius (dashed) once the flood is under way
    if (age > 5200 && fade > 0) {
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = `rgba(245,159,0,${0.35 * fade * Math.min(1, (age - 5200) / 800)})`;
      ctx.beginPath(); ctx.arc(originPt.x, originPt.y, RADIUS(), 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }

    // rings
    for (const ring of rings) {
      const ra = now - ring.t0, rr = ra * 0.14;
      if (rr > RANGE()) continue;
      const a = (1 - rr / RANGE()) * 0.55;
      ctx.strokeStyle = `rgba(255,107,107,${a})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, rr, 0, 7); ctx.stroke();
    }

    // nodes
    for (const n of nodes) {
      const has = n.heard && fade > 0;
      if (has) { // halo
        ctx.fillStyle = n.suppressed
          ? `rgba(134,142,150,${0.18 * fade})`
          : `rgba(255,107,107,${0.22 * fade})`;
        ctx.beginPath(); ctx.arc(n.x, n.y, 13, 0, 7); ctx.fill();
      }
      if (n.fixed) {
        ctx.fillStyle = '#0CA678';
        ctx.fillRect(n.x - 5, n.y - 5, 10, 10);
      } else {
        ctx.fillStyle = n === origin && fade > 0 ? '#FF6B6B' : '#5C7CFA';
        ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, 7); ctx.fill();
      }
    }
  }

  function loop(now) {
    step(now); draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
